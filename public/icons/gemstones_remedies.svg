<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="gemBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faf5ff" />
      <stop offset="100%" stop-color="#f3e8ff" />
    </linearGradient>
    <linearGradient id="rubyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#9f1239" />
    </linearGradient>
    <linearGradient id="facetTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fda4af" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="96" height="96" rx="20" fill="url(#gemBg)" stroke="#d8b4fe" stroke-width="1.5" />

  <!-- Outer Shimmer Rays -->
  <circle cx="50" cy="50" r="38" fill="none" stroke="#c084fc" stroke-width="1" stroke-dasharray="3 3" opacity="0.6" />

  <!-- Faceted Navratna Gemstone (Brilliant Diamond Cut) -->
  <!-- Main Body -->
  <polygon points="30,28 70,28 85,46 50,82 15,46" fill="url(#rubyGrad)" stroke="#881337" stroke-width="1.5" />

  <!-- Top Table Facet -->
  <polygon points="36,28 64,28 58,40 42,40" fill="url(#facetTop)" stroke="#881337" stroke-width="1" />

  <!-- Side Facets -->
  <polygon points="30,28 36,28 42,40 15,46" fill="#fb7185" stroke="#881337" stroke-width="0.8" opacity="0.9" />
  <polygon points="70,28 64,28 58,40 85,46" fill="#be123c" stroke="#881337" stroke-width="0.8" opacity="0.9" />

  <!-- Lower Pavilion Facets -->
  <polygon points="15,46 42,40 50,82" fill="#e11d48" stroke="#881337" stroke-width="0.8" />
  <polygon points="42,40 58,40 50,82" fill="#fda4af" stroke="#881337" stroke-width="0.8" opacity="0.95" />
  <polygon points="58,40 85,46 50,82" fill="#9f1239" stroke="#881337" stroke-width="0.8" />

  <!-- Radiant Light Glint Sparkle -->
  <polygon points="68,22 70,26 74,27 70,28 68,32 66,28 62,27 66,26" fill="#fff" />
</svg>
