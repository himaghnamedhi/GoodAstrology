<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="yogaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff7ed" />
      <stop offset="100%" stop-color="#ffedd5" />
    </linearGradient>
    <linearGradient id="crownGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="96" height="96" rx="20" fill="url(#yogaBg)" stroke="#fed7aa" stroke-width="1.5" />

  <!-- Auspicious Radiant Halo -->
  <circle cx="50" cy="50" r="36" fill="none" stroke="#f97316" stroke-width="1" stroke-dasharray="2 3" opacity="0.6" />

  <!-- Royal Raja Yoga Crown -->
  <path d="M 22,64 L 28,34 L 40,48 L 50,24 L 60,48 L 72,34 L 78,64 Z" fill="url(#crownGold)" stroke="#78350f" stroke-width="1.5" stroke-linejoin="round" />
  
  <!-- Crown Base Band -->
  <rect x="22" y="62" width="56" height="10" rx="3" fill="#b45309" stroke="#78350f" stroke-width="1.2" />

  <!-- Jewels on Crown Peak Tips -->
  <circle cx="28" cy="32" r="3" fill="#ef4444" stroke="#fff" stroke-width="0.8" />
  <circle cx="50" cy="22" r="4" fill="#3b82f6" stroke="#fff" stroke-width="1" />
  <circle cx="72" cy="32" r="3" fill="#ef4444" stroke="#fff" stroke-width="0.8" />

  <!-- Crown Base Jewels -->
  <circle cx="34" cy="67" r="2.5" fill="#fef08a" />
  <circle cx="50" cy="67" r="3" fill="#10b981" />
  <circle cx="66" cy="67" r="2.5" fill="#fef08a" />

  <!-- Auspicious Star Shimmer -->
  <polygon points="50,10 52,14 56,15 52,17 50,21 48,17 44,15 48,14" fill="#f59e0b" />
</svg>
