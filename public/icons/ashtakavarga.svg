<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="savBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ecfdf5" />
      <stop offset="100%" stop-color="#d1fae5" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="96" height="96" rx="20" fill="url(#savBg)" stroke="#6ee7b7" stroke-width="1.5" />

  <!-- 4x4 Grid Matrix Container -->
  <rect x="16" y="16" width="68" height="68" rx="8" fill="#fff" stroke="url(#emeraldGrad)" stroke-width="1.8" />
  
  <!-- Grid Lines -->
  <line x1="33" y1="16" x2="33" y2="84" stroke="#a7f3d0" stroke-width="1.2" />
  <line x1="50" y1="16" x2="50" y2="84" stroke="#a7f3d0" stroke-width="1.5" />
  <line x1="67" y1="16" x2="67" y2="84" stroke="#a7f3d0" stroke-width="1.2" />
  <line x1="16" y1="33" x2="84" y2="33" stroke="#a7f3d0" stroke-width="1.2" />
  <line x1="16" y1="50" x2="84" y2="50" stroke="#a7f3d0" stroke-width="1.5" />
  <line x1="16" y1="67" x2="84" y2="67" stroke="#a7f3d0" stroke-width="1.2" />

  <!-- Glowing Golden Bindus (Benefic Points) in Cells -->
  <circle cx="24.5" cy="24.5" r="4.5" fill="#10b981" />
  <circle cx="41.5" cy="24.5" r="3.5" fill="#059669" />
  <circle cx="58.5" cy="24.5" r="5" fill="#f59e0b" />
  <circle cx="75.5" cy="24.5" r="4" fill="#10b981" />

  <circle cx="24.5" cy="41.5" r="3" fill="#059669" />
  <circle cx="41.5" cy="41.5" r="5.5" fill="#f59e0b" stroke="#fff" stroke-width="1" />
  <circle cx="58.5" cy="41.5" r="4" fill="#10b981" />
  <circle cx="75.5" cy="41.5" r="5" fill="#f59e0b" />

  <circle cx="24.5" cy="58.5" r="5" fill="#f59e0b" />
  <circle cx="41.5" cy="58.5" r="4" fill="#10b981" />
  <circle cx="58.5" cy="58.5" r="6" fill="#d97706" stroke="#fff" stroke-width="1" />
  <circle cx="75.5" cy="58.5" r="3.5" fill="#059669" />

  <circle cx="24.5" cy="75.5" r="4" fill="#10b981" />
